<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homeschool Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EE;
    --paper-dark:#F1EAD9;
    --ink:#2B2A28;
    --ink-soft:#6b675e;
    --rule:#C9D6DE;
    --cover:#B5482F;
    --cover-dark:#8f3823;
    --gold:#D9A441;
    --moss:#5C7A5C;
    --dusty:#5B7A99;
    --plum:#7A5C7A;
    --paper-shadow: 0 1px 0 rgba(0,0,0,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--paper-dark);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{
    max-width:1200px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  /* ---- Cover header ---- */
  .cover{
    background: var(--cover);
    background-image:
      linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.08)),
      repeating-linear-gradient(135deg, rgba(0,0,0,0.03) 0 2px, transparent 2px 6px);
    border-radius:10px 10px 4px 4px;
    padding:26px 30px 22px;
    color:#FBF3EA;
    position:relative;
    box-shadow: 0 6px 0 var(--cover-dark), 0 10px 18px rgba(0,0,0,0.18);
    margin-bottom:34px;
  }
  .cover:before{
    content:"";
    position:absolute; left:22px; top:0; bottom:0; width:2px;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.5) 0 6px, transparent 6px 14px);
    opacity:.5;
  }
  .cover-row{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .cover h1{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:34px;
    margin:0 0 4px 28px;
    letter-spacing:.5px;
  }
  .cover .sub{
    margin:0 0 0 28px;
    font-size:13px;
    opacity:.85;
    font-family:'Space Mono',monospace;
  }
  .title-input{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:34px;
    background:transparent;
    border:none;
    color:#FBF3EA;
    margin-left:28px;
    width:100%;
    max-width:520px;
    padding:2px 4px;
    border-bottom:2px dashed transparent;
  }
  .title-input:focus{outline:none; border-bottom:2px dashed rgba(255,255,255,0.6);}
  .week-nav{
    display:flex; align-items:center; gap:10px;
    font-family:'Space Mono',monospace;
    font-size:13px;
  }
  .week-nav button{
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.35);
    color:#FBF3EA;
    border-radius:6px;
    width:30px; height:30px;
    cursor:pointer;
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .week-nav button:hover{background:rgba(255,255,255,0.25);}
  .week-label{min-width:150px; text-align:center;}

  /* ---- Layout ---- */
  .board{
    display:grid;
    grid-template-columns: 220px 1fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width:820px){
    .board{grid-template-columns:1fr;}
  }

  /* ---- Sidebar shelves ---- */
  .shelf-stack{
    position:sticky;
    top:20px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .shelf{
    background: var(--paper);
    border-radius:8px;
    padding:16px 14px 18px;
    box-shadow: var(--paper-shadow), 0 2px 8px rgba(0,0,0,0.06);
  }
  .shelf.extra{
    border-top:4px solid var(--gold);
  }
  .shelf h2{
    font-family:'Kalam',cursive;
    font-size:18px;
    margin:0 0 12px;
    color:var(--ink);
    border-bottom:2px solid var(--ink);
    padding-bottom:6px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .subject-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .subject-card{
    display:flex; flex-direction:column; gap:8px;
    background:#fff;
    border:1px solid var(--rule);
    border-left:8px solid var(--moss);
    border-radius:6px;
    padding:8px 10px;
    cursor:grab;
    font-size:13.5px;
    font-weight:500;
    user-select:none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .subject-card:hover{ box-shadow:0 3px 6px rgba(0,0,0,0.12); transform:translateY(-1px); }
  .subject-card.dragging{ opacity:.4; }
  .subject-card-top{ display:flex; align-items:center; gap:8px; }
  .subject-card .del{
    margin-left:0;
    background:none; border:none; color:var(--ink-soft);
    cursor:pointer; font-size:14px; line-height:1; padding:2px;
  }
  .subject-card .del:hover{ color:var(--cover); }
  .subject-card .repeat-toggle{
    margin-left:auto;
    background:none; border:1px solid var(--rule); border-radius:5px;
    cursor:pointer; font-size:12px; line-height:1; padding:3px 6px;
    color:var(--ink-soft);
  }
  .subject-card .repeat-toggle:hover{ background:var(--paper-dark); color:var(--ink); }
  .subject-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .repeat-row{
    flex-direction:column;
    gap:8px;
    border-top:1px dashed var(--rule);
    padding-top:8px;
    cursor:default;
  }
  .repeat-days{
    display:flex;
    gap:4px;
  }
  .repeat-day-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-size:9.5px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .repeat-day-box input{ cursor:pointer; }
  .repeat-fields{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
  }
  .repeat-fields input[type=date], .repeat-fields select, .repeat-weeks{
    font-family:'Space Mono',monospace;
    font-size:11px;
    padding:4px 6px;
    border:1px solid var(--rule);
    border-radius:5px;
    background:#fff;
  }
  .repeat-weeks-label{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
  }
  .repeat-weeks{ width:52px; }
  .repeat-status{
    font-size:10.5px;
    color:var(--ink-soft);
    margin:0;
  }

  .add-subject{
    display:flex; flex-direction:column; gap:6px;
    border-top:1px dashed var(--rule);
    padding-top:12px;
  }
  .add-subject input[type=text]{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:7px 8px;
    border:1px solid var(--rule);
    border-radius:5px;
    background:#fff;
  }
  .swatches{display:flex; gap:6px; flex-wrap:wrap;}
  .swatch{
    width:20px; height:20px; border-radius:50%;
    cursor:pointer; border:2px solid transparent;
  }
  .swatch.selected{ border-color:var(--ink); }
  .add-subject button.go{
    margin-top:2px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:5px;
    padding:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .add-subject button.go:hover{ background:#000; }
  .hint{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:10px;
    line-height:1.5;
  }

  /* ---- Week grid ---- */
  .calendar-scroll{
    overflow-x:auto;
    border-radius:8px;
    box-shadow: var(--paper-shadow), 0 2px 8px rgba(0,0,0,0.06);
  }
  .calendar{
    display:grid;
    grid-template-columns: 58px repeat(var(--cols,5), minmax(128px, 1fr));
    background: var(--paper);
    border-radius:8px;
    overflow:hidden;
  }
  .cal-corner{
    background: var(--paper-dark);
    border-bottom:1px solid var(--rule);
  }
  .cal-day-head{
    background: var(--paper-dark);
    border-bottom:1px solid var(--rule);
    border-left:1px solid var(--rule);
    border-top:4px solid var(--dusty);
    padding:8px 8px 6px;
    text-align:center;
    font-family:'Space Mono',monospace;
  }
  .cal-day-head.weekend{ border-top-color:var(--plum); }
  .cal-day-head.is-holiday{ border-top-color:var(--cover); background:rgba(181,72,47,0.08); }
  .cal-day-head .name{ font-weight:700; font-size:12px; letter-spacing:.5px; text-transform:uppercase; }
  .cal-day-head .date{ font-size:10.5px; color:var(--ink-soft); margin-top:1px; }
  .cal-day-head .holiday-name{
    font-size:9px;
    color:var(--cover);
    font-weight:700;
    margin-top:2px;
    font-style:italic;
  }
  .cal-time-label{
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:var(--ink-soft);
    text-align:right;
    padding:3px 8px 0 0;
    border-top:1px solid var(--rule);
    white-space:nowrap;
  }
  .cal-time-label.half{ border-top:1px dashed var(--rule); color:transparent; }
  .cal-time-label.anytime{
    font-size:10px;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    border-top:none;
    padding-top:8px;
  }
  .cal-cell{
    border-top:1px solid var(--rule);
    border-left:1px solid var(--rule);
    min-height:32px;
    padding:3px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .cal-cell.half-cell{ border-top:1px dashed var(--rule); }
  .cal-cell.anytime-cell{
    min-height:38px;
    background: rgba(217,164,65,0.06);
    border-top:none;
    padding-top:6px;
    padding-bottom:8px;
  }
  .cal-cell.dragover{ background-color:rgba(217,164,65,0.16); }
  .task-card{
    background:#fff;
    border:1px solid var(--rule);
    border-left:6px solid var(--moss);
    border-radius:5px;
    padding:5px 7px;
    font-size:12px;
    display:flex;
    flex-direction:column;
    gap:3px;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  .task-card.dragging{ opacity:.35; }
  .task-top{ display:flex; align-items:center; gap:5px; cursor:grab; }
  .task-top .task-name{ flex:1; font-weight:600; }
  .task-top .chevron{
    font-size:9px;
    color:var(--ink-soft);
    transition: transform .12s ease;
    flex-shrink:0;
  }
  .task-card.expanded .task-top .chevron{ transform: rotate(90deg); }
  .task-top .remove{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0 2px;
  }
  .task-top .remove:hover{ color:var(--cover); }
  .task-slot-label{
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:var(--ink-soft);
    cursor:grab;
  }
  .note-preview{
    font-size:10.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-style:italic;
  }
  .task-details{ display:none; flex-direction:column; gap:4px; margin-top:2px; }
  .task-card.expanded .task-details{ display:flex; }
  .lesson-label{
    font-size:10px;
    font-weight:600;
    letter-spacing:.3px;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .task-note{
    font-size:11.5px;
    color:var(--ink);
    border:1px solid var(--rule);
    background: var(--paper-dark);
    border-radius:4px;
    resize:none;
    font-family:'Inter',sans-serif;
    padding:5px 6px;
    min-height:44px;
    cursor:text;
  }
  .task-note:focus{ outline:none; }
  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:26px;
    font-family:'Space Mono',monospace;
  }
  .toolbar{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;
  }
  .toolbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .toolbar button{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:6px;
    padding:7px 12px;
    font-size:12px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    color:var(--ink);
    text-transform:capitalize;
  }
  .toolbar button:hover{ background:var(--paper-dark); }
  .toolbar select{
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    padding:5px 6px;
    border:1px solid var(--rule);
    border-radius:5px;
    background:#fff;
    color:var(--ink);
  }
  .view-toggle{
    display:flex;
    border:1px solid var(--rule);
    border-radius:6px;
    overflow:hidden;
  }
  .view-btn{
    background:#fff;
    border:none;
    border-right:1px solid var(--rule);
    padding:7px 16px;
    font-size:12px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    cursor:pointer;
    color:var(--ink);
  }
  .view-btn:last-child{ border-right:none; }
  .view-btn:hover{ background:var(--paper-dark); }
  .view-btn.active{ background:var(--ink); color:var(--paper); }

  /* ---- Calendar sync (import/export) ---- */
  .sync-bar{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:14px;
  }
  .sync-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  #exportIcsBtn, .sync-import-btn{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:6px;
    padding:7px 12px;
    font-size:12px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    cursor:pointer;
    color:var(--ink);
  }
  #exportIcsBtn:hover, .sync-import-btn:hover{ background:var(--paper-dark); }
  .sync-status{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:0;
    min-height:14px;
  }

  /* ---- Month view ---- */
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:1px;
    background:var(--rule);
    border:1px solid var(--rule);
    border-radius:8px;
    overflow:hidden;
    min-width:560px;
  }
  .month-head-cell{
    background:var(--paper-dark);
    padding:8px 6px;
    text-align:center;
    font-family:'Space Mono',monospace;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--ink-soft);
  }
  .month-day-cell{
    background:var(--paper);
    height:104px;
    padding:6px;
    display:flex;
    flex-direction:column;
    gap:3px;
    cursor:pointer;
    overflow:hidden;
  }
  .month-day-cell:hover{ background:var(--paper-dark); }
  .month-day-cell.outside{ opacity:.4; }
  .month-day-cell.today{ box-shadow:inset 0 0 0 2px var(--gold); }
  .month-day-cell.is-holiday{ background:rgba(181,72,47,0.07); }
  .month-holiday-tag{
    font-size:8.5px;
    font-weight:700;
    color:var(--cover);
    font-style:italic;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .month-day-num{
    font-family:'Space Mono',monospace;
    font-size:11px;
    font-weight:700;
  }
  .month-pill{
    font-size:9.5px;
    padding:2px 6px;
    border-radius:8px;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .month-more{
    font-size:9.5px;
    color:var(--ink-soft);
  }

  /* ---- Student roster ---- */
  .roster{
    background: var(--paper);
    border-radius:8px;
    padding:14px 16px;
    box-shadow: var(--paper-shadow), 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom:18px;
  }
  .roster h2{
    font-family:'Kalam',cursive;
    font-size:16px;
    margin:0 0 10px;
  }
  .roster-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .chip{
    display:flex; align-items:center; gap:7px;
    background:#fff;
    border:1.5px solid var(--rule);
    border-radius:20px;
    padding:5px 6px 5px 5px;
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    border-color:var(--ink);
    background: var(--paper-dark);
  }
  .avatar-slot{
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700;
    font-family:'Space Mono',monospace;
    flex-shrink:0;
    overflow:hidden;
    cursor:pointer;
  }
  .avatar-slot:hover{ box-shadow:0 0 0 2px var(--gold); }
  .avatar-slot svg{ display:block; }
  .chip .progress{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .chip .del{
    background:none; border:none; color:var(--ink-soft);
    cursor:pointer; font-size:13px; padding:0 2px 0 0;
    line-height:1;
  }
  .chip .del:hover{ color:var(--cover); }
  .chip.chip-confirm{
    gap:8px;
    border-color:var(--cover);
    background:var(--paper-dark);
  }
  .chip-confirm-text{
    font-size:11.5px;
    color:var(--ink);
  }
  .chip-confirm-yes, .chip-confirm-no{
    border:none;
    border-radius:5px;
    padding:4px 9px;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .chip-confirm-yes{ background:var(--cover); color:#fff; }
  .chip-confirm-yes:hover{ background:var(--cover-dark); }
  .chip-confirm-no{ background:#fff; border:1px solid var(--rule); color:var(--ink-soft); }
  .chip-confirm-no:hover{ background:var(--paper-dark); }
  .chip.all{
    background: var(--ink);
    color: var(--paper);
    border-color:var(--ink);
  }
  .chip.all.active{ background:#000; }
  .add-student{
    display:flex; align-items:center; gap:6px;
    margin-left:auto;
  }
  .add-student input[type=text]{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    padding:6px 8px;
    border:1px solid var(--rule);
    border-radius:16px;
    width:120px;
  }
  .add-student .swatch{ width:18px; height:18px; }
  .add-student button.go{
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:16px;
    padding:6px 12px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    white-space:nowrap;
  }
  .add-student button.go:hover{ background:#000; }

  /* ---- Per-student task controls ---- */
  .task-assign{
    display:flex; align-items:center; gap:6px;
    margin-top:1px;
  }
  .task-assign select{
    flex:1;
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    color:var(--ink-soft);
    background:transparent;
    border:none;
    padding:0;
  }
  .task-assign select:focus{ outline:none; }
  .task-done{
    display:flex; align-items:center; gap:5px;
    font-size:10.5px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .task-done input[type=checkbox]{
    accent-color: var(--moss);
    cursor:pointer;
  }
  .task-card.is-done{ opacity:.6; }
  .task-card.is-done .task-name{ text-decoration:line-through; }

  /* ---- Subject nav menu ---- */
  .subject-nav{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    background: var(--paper);
    border-radius:8px;
    padding:10px 14px;
    box-shadow: var(--paper-shadow), 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom:18px;
  }
  .nav-pill{
    display:flex; align-items:center; gap:7px;
    padding:6px 14px;
    border-radius:20px;
    border:1.5px solid var(--rule);
    background:#fff;
    font-size:12.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    cursor:pointer;
  }
  .nav-pill:hover{ border-color:var(--ink-soft); }
  .nav-pill.active{ border-color:var(--ink); background:var(--paper-dark); }
  .nav-pill .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .nav-pill.home{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .nav-pill.home.active{ background:#000; }

  .nav-dropdown{ position:relative; }
  .dropdown-toggle .caret{ font-size:9px; margin-left:2px; }
  .dropdown-menu{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:8px;
    box-shadow:0 6px 16px rgba(0,0,0,0.14);
    padding:6px;
    min-width:190px;
    flex-direction:column;
    gap:2px;
    z-index:20;
  }

    messagingSenderId: "468956605950",
    appId: "1:468956605950:web:a0ff3b748844efa37424af"
  };

  let fbOk = false;
  let stateDocRef = null;

  try{
    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);
    stateDocRef = doc(db, "planner", "shared");
    fbOk = true;
  }catch(e){
    console.error('Firebase init failed', e);
  }

  window.fbLoadState = async function(){
    if(!fbOk) return {ok:false, data:null};
    try{
      const snap = await getDoc(stateDocRef);
      return {ok:true, data: snap.exists() ? snap.data() : null};
    }catch(e){
      console.error('Firebase load failed', e);
      return {ok:false, data:null};
    }
  };

  window.fbSaveState = async function(stateObj){
    if(!fbOk) return false;
    try{
      await setDoc(stateDocRef, JSON.parse(JSON.stringify(stateObj)));
      return true;
    }catch(e){
      console.error('Firebase save failed', e);
      return false;
    }
  };

  window.fbReadyResolve(fbOk);
</script>

function shadeColor(hex, percent){
  const num = parseInt(hex.replace('#',''), 16);
  let r = (num >> 16) + Math.round(2.55 * percent);
  let g = ((num >> 8) & 0x00FF) + Math.round(2.55 * percent);
  let b = (num & 0x0000FF) + Math.round(2.55 * percent);
  r = Math.min(255, Math.max(0, r));
  g = Math.min(255, Math.max(0, g));
  b = Math.min(255, Math.max(0, b));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function avatarHairShape(hairStyle, hairColor, hairHighlight, gid){
  if(hairStyle === 'bald') return '';
  const strands = `
    <path d="M31 19 Q36 13 43 12" stroke="${hairHighlight}" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M57 12 Q64 13 69 19" stroke="${hairHighlight}" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.5"/>
  `;

  function cap(baseY, amplitude, cy, rx, ry, idSuffix, opacity){
    const id = gid + '-' + idSuffix;
    const wave = `M0,${baseY} Q12.5,${baseY-amplitude} 25,${baseY} Q37.5,${baseY+amplitude} 50,${baseY} Q62.5,${baseY-amplitude} 75,${baseY} Q87.5,${baseY+amplitude} 100,${baseY} L100,0 L0,0 Z`;
    return `<defs><clipPath id="${id}"><path d="${wave}"/></clipPath></defs><g clip-path="url(#${id})"><ellipse cx="50" cy="${cy}" rx="${rx}" ry="${ry}" fill="${hairColor}" opacity="${opacity||1}"/></g>`;
  }

  switch(hairStyle){
    case 'buzz':
      return cap(22, 1.5, 30, 24, 18, 'buzz', 0.92);
    case 'short':
      return cap(26, 3, 28, 26, 23, 'short') + strands;
    case 'curly':

           <path d="M83 44 C85 34 82 30 76 30 L76 45 C76 58 78 76 80 82 C84 80 85 60 83 44 Z" fill="${hairColor}"/>`

async function loadState(){
  await window.fbReadyPromise;

  let fbResult = {ok:false, data:null};
  try{
    fbResult = await window.fbLoadState();
  }catch(e){
    console.error('Firebase load failed', e);
  }

  if(fbResult.data){
    // Normal case: Firestore already has data, use it as the source of truth.
    state = Object.assign(state, fbResult.data);
  } else {
    // No Firestore doc yet (or Firebase unreachable). Check for existing Claude-local data to migrate once.
    let migrated = null;
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        migrated = JSON.parse(res.value);
        state = Object.assign(state, migrated);
      }
    }catch(e){
      // no local data either, defaults stand
    }
    // Push the starting state (migrated or defaults) up to Firestore, if we actually reached it.
    if(fbResult.ok){
      try{
        await window.fbSaveState(state);
      }catch(e){
        console.error('Initial Firebase save failed', e);
      }
    }
  }

  updateFooterNote(fbResult.ok);
  render();
}

function updateFooterNote(ok){
  const note = document.getElementById('footerNote');
  if(!note) return;
  if(ok){
    note.textContent = 'Synced across your devices.';
  } else {
    note.textContent = "Couldn't reach your synced storage right now — changes are only saved on this device/session until that's fixed.";
  }
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(e){
    // window.storage isn't available outside Claude — that's fine, Firestore is the real save.
  }
  let fbOk = false;
  try{
    fbOk = await window.fbSaveState(state);
  }catch(e){
    console.error('Firebase save failed', e);
  }
  updateFooterNote(fbOk);
}

function getSunday(offsetWeeks){
  const now = new Date();
  const day = now.getDay(); // 0 Sun - 6 Sat
  const diffToSunday = -day;
  const sunday = new Date(now);
  sunday.setDate(now.getDate() + diffToSunday + offsetWeeks*7);
  sunday.setHours(0,0,0,0);
  return sunday;
}

function fmtRange(sunday, numDays){
  const end = new Date(sunday);
  end.setDate(sunday.getDate() + numDays - 1);
  const opts = {month:'short', day:'numeric'};
  return sunday.toLocaleDateString(undefined, opts) + ' – ' + end.toLocaleDateString(undefined, opts) + ', ' + end.getFullYear();
}

function fmtRangeDates(start, end){
  const opts = {month:'short', day:'numeric'};
  return start.toLocaleDateString(undefined, opts) + ' – ' + end.toLocaleDateString(undefined, opts) + ', ' + end.getFullYear();
}

  const indices = visibleDayIndices();
  let total=0, done=0;
  indices.forEach(i=>{
    const tasks = state.schedule[dayKey(i)] || [];
    tasks.forEach(t=>{
      if(t.studentId === studentId){
        total++;
        if(t.done) done++;

  });
  return {done, total};
}

function scheduleRecurring(item, itemType, dayIndices, startDateIso, weeksCount, slot, studentId){
  const startDate = parseIsoDate(startDateIso);
  const {weekOffset: baseOffset} = dateToSlot(startDate);
  let count = 0;
  for(let w=0; w<weeksCount; w++){
    const sunday = getSunday(baseOffset + w);
    dayIndices.forEach(i=>{
      const d = new Date(sunday);
      d.setDate(sunday.getDate()+i);
      if(d < startDate) return;
      const {weekOffset, dayIndex} = dateToSlot(d);
      const key = weekOffset + '|' + dayIndex;
      const newTask = {
        id: uid(), name: item.name, color: item.color, slot: slot,
        note:'', studentId: studentId, done:false,
        subjectId: itemType==='subject' ? item.id : null,
        extraId: itemType==='extra' ? item.id : null
      };
      if(!state.schedule[key]) state.schedule[key] = [];
      state.schedule[key].push(newTask);
      count++;
    });
  }
  saveState();
  return count;
}

    const slotOptions = ['<option value="">Any time</option>']
      .concat(timeSlots(state.dayStartHour, state.dayEndHour).map(sl=>`<option value="${sl}">${formatSlotLabel(sl)}</option>`))
      .join('');

    card.innerHTML = `
      <div class="subject-card-top">
        <span class="subject-name">${escapeHtml(s.name)}</span>
        <button class="repeat-toggle" title="Schedule recurring">&#128257; Repeat</button>
        <button class="del" title="Remove from shelf">&times;</button>
      </div>
      <div class="repeat-row" style="display:none;">
        <div class="repeat-days">
          ${dayLetters.map((l,i)=>`<label class="repeat-day-box"><input type="checkbox" value="${i}"/>${l}</label>`).join('')}
        </div>
        <div class="repeat-fields">
          <input type="date" class="repeat-start" value="${todayIso}" />
          <select class="repeat-slot">${slotOptions}</select>
          <label class="repeat-weeks-label">for <input type="number" class="repeat-weeks" min="1" max="52" value="12" /> weeks</label>
        </div>
        <button class="go repeat-confirm">Schedule recurring</button>
        <p class="repeat-status"></p>
      </div>
    `;

    card.addEventListener('dragstart', (e)=>{
      dragPayload = {type:dragType, subjectId:s.id};
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));

    card.querySelector('.del').addEventListener('click', ()=>{
      onRemove(s.id);
      saveState();
      renderShelf(listElId, items.filter(x=>x.id!==s.id), dragType, onRemove);
    });

    const repeatRow = card.querySelector('.repeat-row');
    card.querySelector('.repeat-toggle').addEventListener('click', (e)=>{
      e.stopPropagation();
      repeatRow.style.display = repeatRow.style.display === 'none' ? 'flex' : 'none';
    });
    repeatRow.addEventListener('click', (e)=> e.stopPropagation());

    card.querySelector('.repeat-confirm').addEventListener('click', (e)=>{
      e.stopPropagation();
      const statusEl = card.querySelector('.repeat-status');
      const checked = Array.from(card.querySelectorAll('.repeat-days input:checked')).map(cb=>parseInt(cb.value,10));
      if(checked.length === 0){
        statusEl.textContent = 'Pick at least one day of the week.';
        return;
      }
      const startVal = card.querySelector('.repeat-start').value;
      if(!startVal){
        statusEl.textContent = 'Pick a start date.';
        return;
      }
      const slotVal = card.querySelector('.repeat-slot').value || null;
      const weeksVal = parseInt(card.querySelector('.repeat-weeks').value, 10) || 1;
      const studentId = state.studentFilter !== 'all' ? state.studentFilter : null;
      const count = scheduleRecurring(s, dragType, checked, startVal, weeksVal, slotVal, studentId);
      statusEl.textContent = `Scheduled ${count} time${count===1?'':'s'} across ${weeksVal} week${weeksVal===1?'':'s'}.`;
      renderCalendar();
    });

    list.appendChild(card);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function timeSlots(startHour, endHour){
  const slots = [];
  for(let h=startHour; h<endHour; h++){
    slots.push(h + ':00');
    slots.push(h + ':30');
  }
  return slots;
}

function formatSlotLabel(slot){
  const [hStr, m] = slot.split(':');
  let h = parseInt(hStr, 10);
  const ampm = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return h12 + ':' + m + ' ' + ampm;
}

function isoDate(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

function parseIsoDate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

function dateToSlot(date){
  const base = getSunday(0);
  const diffDays = Math.round((date - base) / 86400000);
  const weekOffset = Math.floor(diffDays/7);
  const dayIndex = ((diffDays % 7) + 7) % 7;
  return {weekOffset, dayIndex};
}

function nthWeekdayOfMonth(year, month, weekday, n){
  const first = new Date(year, month, 1);
  const firstWeekday = first.getDay();
  const day = 1 + ((7 + weekday - firstWeekday) % 7) + (n-1)*7;
  return new Date(year, month, day);
}

function lastWeekdayOfMonth(year, month, weekday){
  const lastDay = new Date(year, month+1, 0).getDate();
  const last = new Date(year, month, lastDay);
  const diff = (7 + last.getDay() - weekday) % 7;
  return new Date(year, month, lastDay - diff);
}

const holidayCache = {};
function getHolidaysForYear(year){
  if(holidayCache[year]) return holidayCache[year];
  const list = [
    {date: isoDate(new Date(year,0,1)), name:"New Year's Day"},
    {date: isoDate(nthWeekdayOfMonth(year,0,1,3)), name:"Martin Luther King Jr. Day"},
    {date: isoDate(nthWeekdayOfMonth(year,1,1,3)), name:"Presidents Day"},
    {date: isoDate(lastWeekdayOfMonth(year,4,1)), name:"Memorial Day"},
    {date: isoDate(new Date(year,5,19)), name:"Juneteenth"},
    {date: isoDate(new Date(year,6,4)), name:"Independence Day"},
    {date: isoDate(nthWeekdayOfMonth(year,8,1,1)), name:"Labor Day"},
    {date: isoDate(nthWeekdayOfMonth(year,9,1,2)), name:"Columbus Day"},
    {date: isoDate(new Date(year,10,11)), name:"Veterans Day"},
    {date: isoDate(nthWeekdayOfMonth(year,10,4,4)), name:"Thanksgiving Day"},
    {date: isoDate(new Date(year,11,25)), name:"Christmas Day"}
  ];
  holidayCache[year] = list;
  return list;
}

function getHoliday(dateObj){
  const iso = isoDate(dateObj);
  const holidays = getHolidaysForYear(dateObj.getFullYear());
  return holidays.find(h => h.date === iso) || null;
}

function renderMonthGrid(){
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = '';

  const anchor = parseIsoDate(state.currentDate);
  const year = anchor.getFullYear();
  const month = anchor.getMonth();

  document.getElementById('weekLabel').textContent = anchor.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  document.getElementById('dateRangeLabel').textContent = '';

  const firstOfMonth = new Date(year, month, 1);
  const firstDow = firstOfMonth.getDay();
  const leading = firstDow;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const totalCells = Math.ceil((leading + daysInMonth) / 7) * 7;

  const gridStart = new Date(year, month, 1 - leading);

  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(n=>{
    const h = document.createElement('div');
    h.className = 'month-head-cell';
    h.textContent = n;
    grid.appendChild(h);
  });

  const todayIso = isoDate(new Date());

  for(let i=0;i<totalCells;i++){
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate()+i);
    const isOutside = cellDate.getMonth() !== month;
    const {weekOffset, dayIndex} = dateToSlot(cellDate);
    const key = weekOffset + '|' + dayIndex;

    const cell = document.createElement('div');
    const cellHoliday = getHoliday(cellDate);
    cell.className = 'month-day-cell' + (isOutside?' outside':'') + (isoDate(cellDate)===todayIso?' today':'') + (cellHoliday?' is-holiday':'');

    const num = document.createElement('div');
    num.className = 'month-day-num';
    num.textContent = cellDate.getDate();
    cell.appendChild(num);

    if(cellHoliday){
      const htag = document.createElement('div');
      htag.className = 'month-holiday-tag';
      htag.textContent = cellHoliday.name;
      cell.appendChild(htag);
    }

    const tasks = (state.schedule[key] || []).filter(t=> state.studentFilter==='all' || t.studentId===state.studentFilter);
    const pillLimit = cellHoliday ? 2 : 3;
    tasks.slice(0,pillLimit).forEach(t=>{
      const pill = document.createElement('div');
      pill.className = 'month-pill';
      pill.style.background = t.color;
      pill.textContent = t.name;
      cell.appendChild(pill);
    });
    if(tasks.length > pillLimit){
      const more = document.createElement('div');
      more.className = 'month-more';
      more.textContent = '+' + (tasks.length-pillLimit) + ' more';
      cell.appendChild(more);
    }

    cell.addEventListener('click', ()=>{
      state.currentDate = isoDate(cellDate);
      state.calendarView = 'day';
      saveState();
      renderCalendar();
    });

    grid.appendChild(cell);
  }
}

function buildCell(key, slot, isHalf){
  const cell = document.createElement('div');
  cell.className = 'cal-cell' + (isHalf ? ' half-cell' : '') + (slot===null ? ' anytime-cell' : '');
  cell.dataset.key = key;

  const allTasks = state.schedule[key] || [];
  const tasks = allTasks.filter(t=>{
    const matchesSlot = (t.slot || null) === slot;
    const matchesStudent = state.studentFilter === 'all' || t.studentId === state.studentFilter;
    return matchesSlot && matchesStudent;
  });
  tasks.forEach(t=> cell.appendChild(renderTaskCard(t, key)));

  cell.addEventListener('dragover', (e)=>{
    e.preventDefault();
    cell.classList.add('dragover');
  });
  cell.addEventListener('dragleave', ()=> cell.classList.remove('dragover'));
  cell.addEventListener('drop', (e)=>{
    e.preventDefault();
    cell.classList.remove('dragover');
    handleDrop(key, slot);
  });

  return cell;
}

function renderTaskCard(t, key){
  const card = document.createElement('div');
  const isExpanded = expandedTaskIds.has(t.id);
  card.className = 'task-card' + (t.done ? ' is-done' : '') + (isExpanded ? ' expanded' : '');
  card.style.borderLeftColor = t.color;
  card.draggable = true;

  const studentOptions = ['<option value="">Unassigned</option>']
    .concat(state.students.map(s=>`<option value="${s.id}" ${t.studentId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`))
    .join('');

  const slotLabel = t.slot ? formatSlotLabel(t.slot) : 'Any time';
  const hasNote = !!(t.note && t.note.trim());
  const previewHtml = (!isExpanded && hasNote)
    ? `<div class="note-preview">${escapeHtml(t.note)}</div>`
    : '';

  card.innerHTML = `
    <div class="task-top">
      <span class="chevron">&#9656;</span>
      <span class="task-name">${escapeHtml(t.name)}</span>
      <button class="remove" title="Remove">&times;</button>
    </div>
    <div class="task-slot-label">${slotLabel}</div>
    ${previewHtml}
    <div class="task-details">
      <span class="lesson-label">Lesson / notes for this day</span>
      <textarea class="task-note" placeholder="What's covered today? Add lesson details or notes...">${escapeHtml(t.note||'')}</textarea>
    </div>
    <div class="task-assign">
      <select>${studentOptions}</select>
      <label class="task-done"><input type="checkbox" ${t.done?'checked':''} /> done</label>
    </div>
  `;

  card.addEventListener('click', (e)=>{
    if(e.target.closest('button, select, input, textarea, label')) return;
    if(expandedTaskIds.has(t.id)) expandedTaskIds.delete(t.id);
    else expandedTaskIds.add(t.id);
    renderCalendar();
  });

  card.addEventListener('dragstart', (e)=>{
    dragPayload = {type:'task', taskId:t.id, fromKey:key};
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', ()=> card.classList.remove('dragging'));

  card.querySelector('.remove').addEventListener('click', (e)=>{
    e.stopPropagation();
    state.schedule[key] = (state.schedule[key]||[]).filter(x=>x.id!==t.id);
    expandedTaskIds.delete(t.id);
    saveState(); renderCalendar();
  });

  const noteInput = card.querySelector('.task-note');
  noteInput.addEventListener('change', ()=>{
    t.note = noteInput.value;
    saveState();
  });

  const assignSelect = card.querySelector('.task-assign select');
  assignSelect.addEventListener('change', ()=>{
    t.studentId = assignSelect.value || null;
    saveState();
    renderRoster();
  });

  const doneCheckbox = card.querySelector('.task-done input');
  doneCheckbox.addEventListener('change', ()=>{
    t.done = doneCheckbox.checked;
    card.classList.toggle('is-done', t.done);
    saveState();
    renderRoster();
  });

  return card;
}

function handleDrop(targetKey, slot){
  if(!dragPayload) return;
  if(dragPayload.type === 'subject' || dragPayload.type === 'extra'){
    const source = dragPayload.type === 'subject' ? state.subjects : state.extracurriculars;
    const subj = source.find(s=>s.id===dragPayload.subjectId);
    if(!subj) return;
    const defaultStudent = state.studentFilter !== 'all' ? state.studentFilter : null;
    const newTask = {
      id: uid(), name: subj.name, color: subj.color, slot: slot, note:'',
      studentId: defaultStudent, done:false,
      subjectId: dragPayload.type === 'subject' ? subj.id : null,
      extraId: dragPayload.type === 'extra' ? subj.id : null
    };
    if(!state.schedule[targetKey]) state.schedule[targetKey] = [];
    state.schedule[targetKey].push(newTask);
  } else if(dragPayload.type === 'task'){
    const fromKey = dragPayload.fromKey;
    const list = state.schedule[fromKey] || [];
    const idx = list.findIndex(x=>x.id===dragPayload.taskId);
    if(idx===-1){ dragPayload=null; return; }
    const [moved] = list.splice(idx,1);
    moved.slot = slot;
    if(!state.schedule[targetKey]) state.schedule[targetKey] = [];
    state.schedule[targetKey].push(moved);
  }
  dragPayload = null;
  saveState();
  renderCalendar();
}

function getAttendancePeriodRange(sunday){
  const today = new Date();
  if(attendancePeriod === 'week'){
    const end = new Date(sunday);
    end.setDate(sunday.getDate()+6);
    return {start: sunday, end: end};
  }
  if(attendancePeriod === 'month'){
    const start = new Date(today.getFullYear(), today.getMonth(), 1);
    const end = new Date(today.getFullYear(), today.getMonth()+1, 0);
    return {start, end};
  }
  if(attendancePeriod === 'year'){
    const y = today.getMonth() >= 7 ? today.getFullYear() : today.getFullYear()-1;
    const start = new Date(y, 7, 1);
    const end = new Date(y+1, 6, 31);
    return {start, end};
  }
  if(attendancePeriod === 'custom' && attendanceCustomStart && attendanceCustomEnd){
    return {start: parseIsoDate(attendanceCustomStart), end: parseIsoDate(attendanceCustomEnd)};
  }
  return {start: null, end: null};
}

function attendancePeriodLabel(range){
  if(attendancePeriod === 'week') return 'This week: ' + fmtRange(range.start, 7);
  if(attendancePeriod === 'month') return range.start.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  if(attendancePeriod === 'year') return 'School year ' + range.start.getFullYear() + '\u2013' + range.end.getFullYear();
  if(attendancePeriod === 'custom'){
    if(range.start && range.end){
      return range.start.toLocaleDateString(undefined,{month:'short', day:'numeric'}) + ' \u2013 ' + range.end.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
    }
    return 'Pick a start and end date';
  }
  return 'All time';
}

function isDateInRange(isoStr, start, end){
  if(!start && !end) return true;
  const d = parseIsoDate(isoStr);
  if(start && d < start) return false;
  if(end && d > end) return false;
  return true;
}

function attendanceStatusLabel(status){
  if(status === 'present') return 'Present';
  if(status === 'absent') return 'Absent';
  if(status === 'excused') return 'Excused';
  return 'Tap to mark';
}

  periodLabelEl.textContent = 'Showing: ' + attendancePeriodLabel(range);
  filterPanel.appendChild(periodLabelEl);

  page.appendChild(filterPanel);

  if(state.students.length === 0){
    const empty = document.createElement('p');
    empty.className = 'subject-empty';
    empty.textContent = 'Add a student on the Calendar page to start tracking attendance.';
    page.appendChild(empty);
    return;
  }

  const list = document.createElement('div');
  list.className = 'attendance-list';

  state.students.forEach(s=>{
    const record = state.attendance[s.id] || {};
    const periodDates = Object.keys(record).filter(d => isDateInRange(d, range.start, range.end));
    const periodPresent = periodDates.filter(d=> record[d] === 'present').length;
    const periodAbsent = periodDates.filter(d=> record[d] === 'absent').length;
    const periodExcused = periodDates.filter(d=> record[d] === 'excused').length;
    const periodLogged = periodDates.length;
    const attendanceRate = periodLogged > 0 ? Math.round((periodPresent / periodLogged) * 100) : null;

    const card = document.createElement('div');
    card.className = 'attendance-card';
    card.style.borderTopColor = s.color;

    let weekPresent = 0, weekMarked = 0;
    const dayRow = document.createElement('div');
    dayRow.className = 'attendance-days';

    for(let i=0;i<7;i++){
      const d = new Date(sunday);
      d.setDate(sunday.getDate() + i);
      const iso = isoDate(d);
      const status = record[iso] || '';
      if(status){ weekMarked++; if(status === 'present') weekPresent++; }

      const dayCell = document.createElement('button');
      dayCell.type = 'button';
      dayCell.className = 'attendance-day status-' + (status || 'none');
      dayCell.innerHTML = `<span class="ad-dow">${DAY_NAMES[i].slice(0,3)}</span><span class="ad-date">${d.getDate()}</span><span class="ad-status">${attendanceStatusLabel(status)}</span>`;
      dayCell.addEventListener('click', ()=>{
        const order = ['', 'present', 'absent', 'excused'];
        const idx = order.indexOf(status);
        const next = order[(idx+1) % order.length];
        if(!state.attendance[s.id]) state.attendance[s.id] = {};
        if(next === ''){ delete state.attendance[s.id][iso]; }
        else { state.attendance[s.id][iso] = next; }
        saveState();
        renderAttendancePage();
      });
      dayRow.appendChild(dayCell);
    }

    const cardHead = document.createElement('div');
    cardHead.className = 'attendance-card-head';
    cardHead.innerHTML = `
      ${avatarMarkup(s, 26)}
      <span class="attendance-name">${escapeHtml(s.name)}</span>
      <span class="attendance-summary">${weekPresent}/${weekMarked} present this week</span>
    `;

    const statsRow = document.createElement('div');
    statsRow.className = 'attendance-stats';
    statsRow.innerHTML = `
      <div class="stat present"><span class="stat-num">${periodPresent}</span><span class="stat-label">Present</span></div>
      <div class="stat absent"><span class="stat-num">${periodAbsent}</span><span class="stat-label">Absent</span></div>
      <div class="stat excused"><span class="stat-num">${periodExcused}</span><span class="stat-label">Excused</span></div>
      <div class="stat total"><span class="stat-num">${periodLogged}</span><span class="stat-label">Days logged</span></div>
      <div class="stat rate"><span class="stat-num">${attendanceRate===null ? '—' : attendanceRate+'%'}</span><span class="stat-label">Attendance rate</span></div>
    `;

    card.appendChild(cardHead);
    card.appendChild(dayRow);
    card.appendChild(statsRow);
    list.appendChild(card);
  });

  page.appendChild(list);
}


function renderChoreShelf(){
  const list = document.getElementById('choreList');
  if(!list) return;
  list.innerHTML = '';
  state.chores.forEach(chore=>{
    const card = document.createElement('div');
    card.className = 'chore-shelf-card';
    card.style.borderLeftColor = chore.color;
    card.draggable = true;
    card.innerHTML = `
      <div class="chore-shelf-top">
        <span class="chore-shelf-name">${escapeHtml(chore.name)}</span>
        <button class="del" title="Remove">&times;</button>
      </div>
      <label class="chore-points-label">Points
        <input type="number" class="chore-points-input" min="0" value="${chore.points || 0}" />
      </label>
    `;

    card.addEventListener('dragstart', (e)=>{
      dragPayload = {type:'chore', subjectId: chore.id};
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));

    card.querySelector('.del').addEventListener('click', ()=>{
      state.chores = state.chores.filter(c=>c.id !== chore.id);
      saveState();
      renderChoreShelf();
    });

    const pointsInput = card.querySelector('.chore-points-input');
    pointsInput.addEventListener('change', ()=>{
      const val = parseInt(pointsInput.value, 10);
      chore.points = isNaN(val) ? 0 : Math.max(0, val);
      pointsInput.value = chore.points;
      saveState();
    });
    pointsInput.addEventListener('click', (e)=> e.stopPropagation());

    list.appendChild(card);
  });
}

function studentAllTimeChorePoints(studentId){
  let total = 0;
  Object.keys(state.choreLog).forEach(dateKey=>{
    const dayLog = state.choreLog[dateKey] || {};
    const items = dayLog[studentId] || [];
    items.forEach(item=>{
      if(item.done) total += (item.points || 0);
    });
  });
  return total;
}

function availableChorePoints(studentId){
  const earned = studentAllTimeChorePoints(studentId);
  const spent = state.pointsRedeemed[studentId] || 0;
  return earned - spent;
}

    card.style.borderTopColor = s.color;

    const cardHead = document.createElement('div');
    cardHead.className = 'chore-list-head';

    goalSection.className = 'goal-section';

    const goalRewardId = state.studentGoals[s.id] || '';
    const goalOptions = ['<option value="">No goal set</option>']
      .concat(state.rewards.map(r=>`<option value="${r.id}" ${goalRewardId===r.id?'selected':''}>${escapeHtml(r.name)} \u2014 ${r.cost} pts</option>`))
      .join('');

    goalSection.innerHTML = `
      <div class="goal-label">Goal</div>
      <select class="goal-select">${goalOptions}</select>
    `;

    const goalReward = state.rewards.find(r=>r.id === goalRewardId);
    if(goalReward){
      const pct = Math.min(100, Math.round((available / goalReward.cost) * 100));
      const progressWrap = document.createElement('div');
      progressWrap.className = 'goal-progress';
      progressWrap.innerHTML = `
        <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%; background:${s.color};"></div></div>
        <p class="goal-progress-text">${Math.min(available, goalReward.cost)}/${goalReward.cost} pts toward ${escapeHtml(goalReward.name)}</p>
      `;
      goalSection.appendChild(progressWrap);

      if(available >= goalReward.cost){
        const redeemBtn = document.createElement('button');
        redeemBtn.type = 'button';
        redeemBtn.className = 'redeem-btn';
        redeemBtn.textContent = '\ud83c\udf89 Redeem ' + goalReward.name;
        redeemBtn.addEventListener('click', function(){
          if(goalSection.querySelector('.clear-confirm')) return;
          this.style.display = 'none';
          const confirmWrap = document.createElement('span');
          confirmWrap.className = 'clear-confirm';
          confirmWrap.innerHTML = `
            <span class="clear-confirm-text">Redeem "${escapeHtml(goalReward.name)}" for ${goalReward.cost} pts?</span>
            <button type="button" class="clear-yes">Yes, redeem</button>
            <button type="button" class="clear-no">Cancel</button>
          `;
          this.insertAdjacentElement('afterend', confirmWrap);
          const btn = this;
          confirmWrap.querySelector('.clear-yes').addEventListener('click', ()=>{
            state.pointsRedeemed[s.id] = (state.pointsRedeemed[s.id] || 0) + goalReward.cost;
            if(!state.redemptions[s.id]) state.redemptions[s.id] = [];
            state.redemptions[s.id].push({id: uid(), name: goalReward.name, cost: goalReward.cost, date: isoDate(new Date())});
            state.studentGoals[s.id] = null;
            saveState();
            renderChoresPage();
          });
          confirmWrap.querySelector('.clear-no').addEventListener('click', ()=>{
            confirmWrap.remove();
            btn.style.display = '';
          });
        });
        goalSection.appendChild(redeemBtn);
      }
    }

    goalSection.querySelector('.goal-select').addEventListener('change', (e)=>{
      state.studentGoals[s.id] = e.target.value || null;
      saveState();
      renderChoresPage();
    });

    card.appendChild(goalSection);

    card.addEventListener('dragover', (e)=>{
      if(dragPayload && dragPayload.type === 'reward'){
        e.preventDefault();
        card.classList.add('reward-dragover');
      }
    });
    card.addEventListener('dragleave', ()=> card.classList.remove('reward-dragover'));
    card.addEventListener('drop', (e)=>{
      if(!dragPayload || dragPayload.type !== 'reward') return;
      e.preventDefault();
      card.classList.remove('reward-dragover');
      const reward = state.rewards.find(r=>r.id === dragPayload.rewardId);
      if(!reward) return;
      state.studentGoals[s.id] = reward.id;
      dragPayload = null;
      saveState();
      renderChoresPage();
    });

    const allTimeRow = document.createElement('p');
    allTimeRow.className = 'chore-alltime-points';
    allTimeRow.textContent = available + ' points available';

    const history = state.redemptions[s.id] || [];
    if(history.length > 0){
      const historyWrap = document.createElement('div');
      historyWrap.className = 'redemption-list';
      history.slice(-3).reverse().forEach(r=>{
        const line = document.createElement('p');
        line.className = 'redemption-item';
        line.textContent = '\ud83c\udfc6 ' + r.name + ' \u2014 ' + parseIsoDate(r.date).toLocaleDateString(undefined,{month:'short',day:'numeric'});
        historyWrap.appendChild(line);
      });
      card.appendChild(historyWrap);

    const dropZone = document.createElement('div');
    dropZone.className = 'chore-items';

    if(items.length === 0){
      const emptyMsg = document.createElement('p');
      emptyMsg.className = 'chore-empty-msg';
      emptyMsg.textContent = 'Drag a chore here';
      dropZone.appendChild(emptyMsg);
    }

    items.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'chore-item' + (item.done ? ' is-done' : '');
      row.style.borderLeft = '6px solid ' + item.color;
      row.innerHTML = `
        <label class="chore-item-check">
          <input type="checkbox" ${item.done?'checked':''} />
          <span class="chore-item-name">${escapeHtml(item.name)}</span>
        </label>
        <span class="chore-item-points">+${item.points||0}</span>
        <button class="del" title="Remove">&times;</button>
      `;
      row.querySelector('input[type=checkbox]').addEventListener('change', (e)=>{
        item.done = e.target.checked;
        saveState();
        renderChoresPage();
      });
      row.querySelector('.del').addEventListener('click', ()=>{
        state.choreLog[choresDate][s.id] = (state.choreLog[choresDate][s.id] || []).filter(x=>x.id !== item.id);
        saveState();
        renderChoresPage();
      });
      dropZone.appendChild(row);
    });

    dropZone.addEventListener('dragover', (e)=>{
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e)=>{
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if(!dragPayload || dragPayload.type !== 'chore') return;
      const chore = state.chores.find(c=>c.id === dragPayload.subjectId);
      if(!chore) return;
      if(!state.choreLog[choresDate]) state.choreLog[choresDate] = {};
      if(!state.choreLog[choresDate][s.id]) state.choreLog[choresDate][s.id] = [];
      state.choreLog[choresDate][s.id].push({
        id: uid(), name: chore.name, color: chore.color, points: chore.points || 0, done:false
      });
      dragPayload = null;
      saveState();
      renderChoresPage();
    });

    card.appendChild(dropZone);
    lists.appendChild(card);
  });
}


function addLessonTask(key, slot, name, color, subjectId, studentId){
  const resolvedStudent = studentId !== undefined ? studentId : (state.studentFilter !== 'all' ? state.studentFilter : null);
  const newTask = {
    id: uid(), name, color, slot, note:'',
    studentId: resolvedStudent, done:false,
    subjectId: subjectId, extraId: null
  };
  if(!state.schedule[key]) state.schedule[key] = [];
  state.schedule[key].push(newTask);
  saveState();
}

function renderLessonBank(subj){
  const bank = document.getElementById('lessonBank');
  if(!bank) return;
  bank.innerHTML = '';
  const allLessons = subj.lessons || [];
  const lessons = lessonBankFilter === 'all'
    ? allLessons
    : allLessons.filter(l => (l.studentId || null) === lessonBankFilter);

  if(allLessons.length === 0){
    bank.innerHTML = '<p class="subject-empty" style="padding:8px 0;">No lessons yet — scan a photo of your lesson index, or add one by hand above.</p>';
    return;
  }
  if(lessons.length === 0){
    bank.innerHTML = '<p class="subject-empty" style="padding:8px 0;">No lessons for this student yet.</p>';
    return;
  }

  const slotOptions = ['<option value="">Any time</option>']
    .concat(timeSlots(state.dayStartHour, state.dayEndHour).map(s=>`<option value="${s}">${formatSlotLabel(s)}</option>`))
    .join('');
  const todayIso = isoDate(new Date());
  const studentOptions = ['<option value="">Any student</option>']
    .concat(state.students.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`))
    .join('');

  lessons.forEach(lesson=>{
    const student = state.students.find(s=>s.id === lesson.studentId);
    const chip = document.createElement('div');
    chip.className = 'lesson-chip';
    chip.draggable = true;
    chip.style.borderLeft = '6px solid ' + subj.color;
    chip.innerHTML = `
      <div class="lesson-chip-top">
        <span class="lesson-name">${escapeHtml(lesson.text)}</span>
        <button class="del" title="Remove">&times;</button>
      </div>
      <div class="lesson-student-row">
        <span class="lesson-student-badge${student ? '' : ' unassigned'}" style="${student ? 'background:'+student.color : ''}">${student ? escapeHtml(student.name) : 'Any student'}</span>
        <select class="lesson-student-select">${studentOptions}</select>
      </div>
      <button class="assign-toggle">Assign to a day</button>
      <div class="lesson-assign-row" style="display:none;">
        <input type="date" class="lesson-date" value="${todayIso}" />
        <select class="lesson-slot">${slotOptions}</select>
        <button class="assign-confirm">Assign</button>
      </div>
    `;
    chip.querySelector('.lesson-student-select').value = lesson.studentId || '';

    chip.addEventListener('dragstart', (e)=>{
      dragPayload = {type:'lesson', name: lesson.text, color: subj.color, subjectId: subj.id, studentId: lesson.studentId || null};
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
    });
    chip.addEventListener('dragend', ()=> chip.classList.remove('dragging'));

    chip.querySelector('.del').addEventListener('click', ()=>{
      if(chip.querySelector('.lesson-confirm')) return;
      const confirmWrap = document.createElement('div');
      confirmWrap.className = 'lesson-confirm';
      confirmWrap.innerHTML = `
        <span class="lesson-confirm-text">Delete this lesson?</span>
        <button type="button" class="lesson-confirm-yes">Yes</button>
        <button type="button" class="lesson-confirm-no">No</button>
      `;
      chip.appendChild(confirmWrap);
      confirmWrap.querySelector('.lesson-confirm-yes').addEventListener('click', ()=>{
        subj.lessons = (subj.lessons || []).filter(l=>l.id !== lesson.id);
        saveState();
        renderLessonBank(subj);
      });
      confirmWrap.querySelector('.lesson-confirm-no').addEventListener('click', ()=>{
        confirmWrap.remove();
      });
    });

    chip.querySelector('.lesson-student-select').addEventListener('change', (e)=>{
      lesson.studentId = e.target.value || null;
      saveState();
      renderLessonBank(subj);
    });

    const row = chip.querySelector('.lesson-assign-row');
    chip.querySelector('.assign-toggle').addEventListener('click', ()=>{
      row.style.display = row.style.display === 'none' ? 'flex' : 'none';
    });

    chip.querySelector('.assign-confirm').addEventListener('click', ()=>{
      const dateVal = chip.querySelector('.lesson-date').value;
      if(!dateVal) return;
      const slotVal = chip.querySelector('.lesson-slot').value || null;
      const date = parseIsoDate(dateVal);
      const {weekOffset, dayIndex} = dateToSlot(date);
      const key = weekOffset + '|' + dayIndex;
      addLessonTask(key, slotVal, lesson.text, subj.color, subj.id, lesson.studentId || null);
      renderSubjectPage();
    });

    bank.appendChild(chip);
  });
}

function stepSubjectCal(dir){
  const d = parseIsoDate(subjectCalDate);
  if(subjectCalView === 'day'){
    d.setDate(d.getDate() + dir);
  } else if(subjectCalView === 'week'){
    d.setDate(d.getDate() + dir*7);
  } else {
    d.setMonth(d.getMonth() + dir);
  }
  subjectCalDate = isoDate(d);
}

function subjectFilteredTasks(key, subj){
  return (state.schedule[key] || []).filter(t=>{
    if(t.subjectId !== subj.id) return false;
    if(subjectCalStudentId === 'all') return true;
    return t.studentId === subjectCalStudentId;
  });
}

function subjectCalChip(t, key, subj, onRemoved){
  const chip = document.createElement('div');
  chip.className = 'scc-chip';
  chip.style.background = t.color;
  const student = state.students.find(s=>s.id === t.studentId);
  const timeLabel = t.slot ? formatSlotLabel(t.slot) : 'Any time';
  chip.title = t.name + ' — ' + timeLabel + (student ? ' — ' + student.name : '');
  const studentTag = (subjectCalStudentId === 'all' && student)
    ? `<span class="scc-chip-student">${escapeHtml(student.name)}</span>`
    : '';
  chip.innerHTML = `<span class="scc-chip-name">${escapeHtml(t.name)}</span>${studentTag}<button class="scc-chip-del">&times;</button>`;
  chip.querySelector('.scc-chip-del').addEventListener('click', (e)=>{
    e.stopPropagation();
    state.schedule[key] = (state.schedule[key] || []).filter(x=>x.id !== t.id);
    saveState();
    onRemoved();
  });
  return chip;
}

function subjectCalDropTarget(cell, key, subj, rerender){
  cell.addEventListener('dragover', (e)=>{
    if(dragPayload && dragPayload.type === 'lesson'){
      e.preventDefault();
      cell.classList.add('dragover');
    }
  });
  cell.addEventListener('dragleave', ()=> cell.classList.remove('dragover'));
  cell.addEventListener('drop', (e)=>{
    if(!dragPayload || dragPayload.type !== 'lesson') return;
    e.preventDefault();
    cell.classList.remove('dragover');
    if(subjectCalStudentId === 'all'){
      state.students.forEach(s=>{
        addLessonTask(key, null, dragPayload.name, dragPayload.color, dragPayload.subjectId, s.id);
      });
    } else {
      addLessonTask(key, null, dragPayload.name, dragPayload.color, dragPayload.subjectId, subjectCalStudentId);
    }
    dragPayload = null;
    rerender();
  });
}

function renderSubjectCalDay(subj){
  const body = document.getElementById('subjCalBody');
  const d = parseIsoDate(subjectCalDate);
  const dHoliday = getHoliday(d);
  document.getElementById('subjCalLabel').textContent = d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}) + (dHoliday ? ' — ' + dHoliday.name : '');

  const {weekOffset, dayIndex} = dateToSlot(d);
  const key = weekOffset + '|' + dayIndex;
  const tasks = subjectFilteredTasks(key, subj);

  body.innerHTML = '';
  const cell = document.createElement('div');
  cell.className = 'subj-day-cell' + (dHoliday ? ' is-holiday' : '');
  if(dHoliday){
    const htag = document.createElement('div');
    htag.className = 'month-holiday-tag';
    htag.textContent = dHoliday.name;
    cell.appendChild(htag);
  }
  if(tasks.length === 0){
    const empty = document.createElement('p');
    empty.className = 'chore-empty-msg';

function renderSubjectCalWeek(subj){
  const body = document.getElementById('subjCalBody');
  const anchor = parseIsoDate(subjectCalDate);
  const {weekOffset} = dateToSlot(anchor);
  const sunday = getSunday(weekOffset);
  document.getElementById('subjCalLabel').textContent = fmtRange(sunday, 7);

  body.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'student-cal-row';

  for(let i=0;i<7;i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    const key = weekOffset + '|' + i;
    const tasks = subjectFilteredTasks(key, subj);
    const dHoliday = getHoliday(d);

    const cell = document.createElement('div');
    cell.className = 'student-cal-cell' + (dHoliday ? ' is-holiday' : '');
    cell.innerHTML = `<div class="scc-date"><span class="scc-dow">${DAY_NAMES[i].slice(0,3)}</span><span class="scc-num">${d.getDate()}</span></div>${dHoliday?`<div class="scc-holiday">${escapeHtml(dHoliday.name)}</div>`:''}`;

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'scc-items';
    tasks.forEach(t=>{
      itemsWrap.appendChild(subjectCalChip(t, key, subj, ()=>renderSubjectCalendar(subj)));
    });
    cell.appendChild(itemsWrap);

    subjectCalDropTarget(cell, key, subj, ()=>renderSubjectPage());
    row.appendChild(cell);
  }
  body.appendChild(row);
}

function renderSubjectCalMonth(subj){
  const body = document.getElementById('subjCalBody');
  const anchor = parseIsoDate(subjectCalDate);
  const year = anchor.getFullYear(), month = anchor.getMonth();
  document.getElementById('subjCalLabel').textContent = anchor.toLocaleDateString(undefined,{month:'long', year:'numeric'});

  const firstOfMonth = new Date(year, month, 1);
  const leading = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const totalCells = Math.ceil((leading + daysInMonth) / 7) * 7;
  const gridStart = new Date(year, month, 1 - leading);

  body.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'month-grid';

  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(n=>{
    const h = document.createElement('div');
    h.className = 'month-head-cell';
    h.textContent = n;
    grid.appendChild(h);
  });

  const todayIso = isoDate(new Date());

  for(let i=0;i<totalCells;i++){
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate()+i);
    const isOutside = cellDate.getMonth() !== month;
    const {weekOffset, dayIndex} = dateToSlot(cellDate);
    const key = weekOffset + '|' + dayIndex;
    const tasks = subjectFilteredTasks(key, subj);
    const cellHoliday = getHoliday(cellDate);

    const cell = document.createElement('div');
    cell.className = 'month-day-cell' + (isOutside?' outside':'') + (isoDate(cellDate)===todayIso?' today':'') + (cellHoliday?' is-holiday':'');

    const num = document.createElement('div');
    num.className = 'month-day-num';
    num.textContent = cellDate.getDate();
    cell.appendChild(num);

    if(cellHoliday){
      const htag = document.createElement('div');
      htag.className = 'month-holiday-tag';
      htag.textContent = cellHoliday.name;
      cell.appendChild(htag);
    }

    const pillLimit = cellHoliday ? 2 : 3;
    tasks.slice(0,pillLimit).forEach(t=>{
      const pill = document.createElement('div');
      pill.className = 'month-pill';
      pill.style.background = t.color;
      pill.textContent = t.name;
      cell.appendChild(pill);
    });
    if(tasks.length > pillLimit){
      const more = document.createElement('div');
      more.className = 'month-more';
      more.textContent = '+' + (tasks.length-pillLimit) + ' more';
      cell.appendChild(more);
    }

    cell.addEventListener('click', ()=>{
      subjectCalDate = isoDate(cellDate);
      subjectCalView = 'day';
      renderSubjectCalendar(subj);
    });

    grid.appendChild(cell);
  }
  body.appendChild(grid);
}

function renderSubjectCalendar(subj){
  document.querySelectorAll('#subjViewToggle .view-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.view === subjectCalView);
  });
  renderSubjectCalStudentTabs(subj);

  if(state.students.length === 0){
    document.getElementById('subjCalLabel').textContent = '';
    document.getElementById('subjCalBody').innerHTML = '<p class="subject-empty">Add a student on the Calendar page to schedule lessons for them here.</p>';
    return;
  }

  if(subjectCalView === 'day') renderSubjectCalDay(subj);
  else if(subjectCalView === 'month') renderSubjectCalMonth(subj);
  else renderSubjectCalWeek(subj);
}

function readFileAsBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = ()=> reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

async function extractLessonsFromImage(base64Data, mediaType){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
          { type: "text", text: "This image shows a lesson plan index, table of contents, syllabus, or unit list for a homeschool subject. Identify each distinct lesson, unit, or chapter listed. For each one, include its number or label exactly as it appears in the image (e.g. 'Lesson 1: ...', 'Unit 3 - ...', 'Chapter 4 ...') followed by its title — do not drop or renumber it, and do not add numbering if the image has none. Respond with ONLY a JSON array of strings — no markdown code fences, no explanation, nothing else." }
        ]
      }]
    })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(b=>b.type === 'text');
  if(!textBlock) throw new Error('No text in response');
  let cleaned = textBlock.text.trim();
  cleaned = cleaned.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
  const arr = JSON.parse(cleaned);
  if(!Array.isArray(arr)) throw new Error('Unexpected format');
  return arr.filter(x=> typeof x === 'string' && x.trim()).map(x=> x.trim());
}

      saveState();
      renderLessonBank(subj);
      confirmWrap.remove();
      btn.style.display = '';
    });
    confirmWrap.querySelector('.clear-no').addEventListener('click', ()=>{
      confirmWrap.remove();
      btn.style.display = '';
    });
  });

  const photoInput = document.getElementById('lessonPhotoInput');
  photoInput.addEventListener('change', async ()=>{
    const file = photoInput.files[0];
    if(!file) return;
    const statusEl = document.getElementById('lessonPhotoStatus');
    statusEl.textContent = 'Reading photo...';
    try{
      const base64 = await readFileAsBase64(file);
      statusEl.textContent = 'Finding lessons in the photo...';
      const mediaType = file.type || 'image/jpeg';
      const lessons = await extractLessonsFromImage(base64, mediaType);
      if(lessons.length === 0){
        statusEl.textContent = "Couldn't find any lessons in that photo. Try a clearer photo, or add them by hand below.";
      } else {
        if(!subj.lessons) subj.lessons = [];
        const forStudent = forStudentSelect.value || null;
        lessons.forEach(text=> subj.lessons.push({id: uid(), text, studentId: forStudent}));
        saveState();
        statusEl.textContent = `Added ${lessons.length} lesson${lessons.length===1?'':'s'} from the photo.`;
        renderLessonBank(subj);
      }
    }catch(err){
      console.error(err);
      statusEl.textContent = "Couldn't read that photo. Try a clearer, well-lit shot, or add lessons by hand below.";
    }
    photoInput.value = '';
  });

  renderLessonFilter(subj);
  renderLessonBank(subj);

  // --- Auto-schedule lessons panel ---
  const autoStudentSelect = document.getElementById('autoScheduleStudent');
  autoStudentSelect.innerHTML = state.students.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  if(state.students.length === 0){
    autoStudentSelect.innerHTML = '<option value="">No students yet</option>';
  }

  const autoDaysWrap = document.getElementById('autoScheduleDays');
  const autoDayLetters = ['S','M','T','W','T','F','S'];
  autoDaysWrap.innerHTML = autoDayLetters.map((l,i)=>{
    const checked = (i>=1 && i<=5) ? 'checked' : '';
    return `<label class="repeat-day-box"><input type="checkbox" value="${i}" ${checked}/>${l}</label>`;
  }).join('');

  document.getElementById('autoScheduleStart').value = isoDate(new Date());

  document.getElementById('autoScheduleBtn').addEventListener('click', ()=>{
    const statusEl = document.getElementById('autoScheduleStatus');
    const studentId = autoStudentSelect.value;
    if(!studentId){
      statusEl.textContent = 'Add a student first.';
      return;
    }
    const checkedDays = Array.from(autoDaysWrap.querySelectorAll('input:checked')).map(cb=>parseInt(cb.value,10));
    if(checkedDays.length === 0){
      statusEl.textContent = 'Pick at least one day of the week.';
      return;
    }
    const startVal = document.getElementById('autoScheduleStart').value;
    if(!startVal){
      statusEl.textContent = 'Pick a start date.';
      return;
    }
    const skipHolidays = document.getElementById('autoScheduleSkipHolidays').checked;
    const lessonsToPlace = (subj.lessons || []).filter(l => l.studentId === studentId || !l.studentId);
    if(lessonsToPlace.length === 0){
      statusEl.textContent = 'No lessons in the bank for that student yet.';
      return;
    }

    let cursor = parseIsoDate(startVal);
    let placed = 0, skippedHolidays = 0, guard = 0;
    while(placed < lessonsToPlace.length && guard < 2000){
      guard++;
      if(checkedDays.includes(cursor.getDay())){
        const holiday = skipHolidays ? getHoliday(cursor) : null;
        if(holiday){
          skippedHolidays++;
        } else {
          const {weekOffset, dayIndex} = dateToSlot(cursor);
          const key = weekOffset + '|' + dayIndex;
          const lesson = lessonsToPlace[placed];
          addLessonTask(key, null, lesson.text, subj.color, subj.id, studentId);
          placed++;
        }
      }
      cursor = new Date(cursor);
      cursor.setDate(cursor.getDate()+1);
    }
    const lastDate = new Date(cursor);
    lastDate.setDate(lastDate.getDate()-1);
    statusEl.textContent = `Scheduled ${placed} lesson${placed===1?'':'s'}, ${startVal} through ${isoDate(lastDate)}` + (skippedHolidays ? ` (skipped ${skippedHolidays} holiday${skippedHolidays===1?'':'s'})` : '') + '.';
    renderCalendar();
  });

  // --- Multi-student subject assign panel ---
  const multiWrap = document.getElementById('multiAssignStudents');
  multiWrap.innerHTML = '';
  state.students.forEach(s=>{
    const label = document.createElement('label');
    label.className = 'multi-assign-chip';
    label.innerHTML = `<input type="checkbox" value="${s.id}" /> ${avatarMarkup(s, 20)}<span>${escapeHtml(s.name)}</span>`;
    multiWrap.appendChild(label);
  });
  if(state.students.length === 0){
    multiWrap.innerHTML = '<p class="subject-empty" style="padding:6px 0;">Add students on the Calendar page first.</p>';
  }

  const multiDateInput = document.getElementById('multiAssignDate');
  multiDateInput.value = isoDate(new Date());
  const multiSlotSelect = document.getElementById('multiAssignSlot');
  multiSlotSelect.innerHTML = ['<option value="">Any time</option>']
    .concat(timeSlots(state.dayStartHour, state.dayEndHour).map(s=>`<option value="${s}">${formatSlotLabel(s)}</option>`))
    .join('');

  document.getElementById('multiAssignBtn').addEventListener('click', ()=>{
    const checked = Array.from(multiWrap.querySelectorAll('input[type=checkbox]:checked')).map(cb=>cb.value);
    if(checked.length === 0) return;
    const dateVal = multiDateInput.value;
    if(!dateVal) return;
    const slotVal = multiSlotSelect.value || null;
    const date = parseIsoDate(dateVal);
    const {weekOffset, dayIndex} = dateToSlot(date);
    const key = weekOffset + '|' + dayIndex;
    checked.forEach(studentId=>{
      addLessonTask(key, slotVal, subj.name, subj.color, subj.id, studentId);
    });
    renderSubjectPage();
  });

  // --- Subject calendar (Day / Week / Month) ---
  renderSubjectCalendar(subj);

  document.querySelectorAll('#subjViewToggle .view-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      subjectCalView = btn.dataset.view;
      renderSubjectCalendar(subj);
    });
  });

  document.getElementById('subjCalPrev').addEventListener('click', ()=>{
    stepSubjectCal(-1);
    renderSubjectCalendar(subj);
  });
  document.getElementById('subjCalNext').addEventListener('click', ()=>{
    stepSubjectCal(1);
    renderSubjectCalendar(subj);
  });

  const list = document.getElementById('subjectEntries');

  if(entries.length === 0){
    list.innerHTML = '<p class="subject-empty">No lessons scheduled yet. Drag this subject onto a day from the calendar, or assign a lesson above.</p>';
    return;
  }

  entries.forEach(({task:t, weekOffset, dayIndex})=>{
    const sunday = getSunday(weekOffset);
    const dateObj = new Date(sunday);
    dateObj.setDate(sunday.getDate() + dayIndex);
    const dateLabel = dateObj.toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric', year:'numeric'});
    const slotLabel = t.slot ? formatSlotLabel(t.slot) : 'Any time';
    const student = state.students.find(s=>s.id===t.studentId);

    const row = document.createElement('div');
    row.className = 'subject-entry' + (t.done ? ' is-done' : '');
    row.innerHTML = `
      <div>
        <div class="entry-day">${dateLabel}</div>
        <div class="entry-time">${slotLabel}${student ? ' &middot; ' + escapeHtml(student.name) : ''}</div>
      </div>
      <textarea class="entry-note" placeholder="What's covered this lesson? Add notes...">${escapeHtml(t.note||'')}</textarea>
      <label class="entry-done"><input type="checkbox" ${t.done?'checked':''} /> done</label>
    `;

    const noteInput = row.querySelector('.entry-note');
    noteInput.addEventListener('change', ()=>{
      t.note = noteInput.value;
      saveState();
    });

    const doneInput = row.querySelector('.entry-done input');
    doneInput.addEventListener('change', ()=>{
      t.done = doneInput.checked;
      row.classList.toggle('is-done', t.done);
      saveState();
    });

    list.appendChild(row);
  });
}

function render(){
  document.getElementById('titleInput').value = state.title;
  document.getElementById('toggleWeekend').textContent = state.showWeekend ? 'Hide weekend' : 'Show weekend';
  populateHourSelects();
  renderSwatches();
  renderExtraSwatches();
  renderStudentSwatches();
  renderRoster();
  renderSubjectShelf();
  renderExtraShelf();
  renderCalendar();
  renderView();
}

// --- Event wiring ---

  state.title = e.target.value || 'Our Homeschool Week';
  saveState();
});

  const input = document.getElementById('newSubjectName');
  const name = input.value.trim();
  if(!name) return;

  state.extracurriculars.push({id: uid(), name, color: selectedExtraColor});

  saveState();
  renderExtraShelf();
});
document.getElementById('newExtraName').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ document.getElementById('addExtraBtn').click(); }
});

document.getElementById('addStudentBtn').addEventListener('click', ()=>{
  const input = document.getElementById('newStudentName');

  if(!name) return;
  const student = {id: uid(), name, color: selectedStudentColor};
  state.students.push(student);
  input.value = '';
